[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odin"
version = "0.1.0"
description = "LLM-to-SQL Pipeline with Intermediate Representation"
dependencies = [
    "langgraph",
    "langchain-openai",
    "pydantic>=2.0.0",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
