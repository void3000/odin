{% extends "base.html" %}

{% block body %}
<div class="app-layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Odin</h2>
            <button class="btn-new-session"
                    hx-post="/sessions"
                    hx-target="#sidebar-content"
                    hx-swap="innerHTML">+ New</button>
        </div>
        <div id="sidebar-content">
            {% include "partials/sidebar.html" %}
        </div>
        <div class="sidebar-footer"></div>
    </div>
    <div class="chat-area" id="chat-area">
        <div class="chat-header">New Chat</div>
        <div class="chat-messages" id="chat-messages">
            <div class="empty-state">
                <div class="empty-state-title">What would you like to know?</div>
                <div class="empty-state-subtitle">Ask a question about your data in plain English</div>
            </div>
        </div>
        <div class="chat-input-area">
            <form class="chat-input-form" onsubmit="return sendMessage(event)">
                <input type="hidden" name="session_id" id="session-id-input" value="">
                <input type="text" name="input" id="chat-input" placeholder="Ask a question..." autocomplete="off" required>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>
</div>

<script>
    let activeSession = null;

    function getActiveSession() { return activeSession; }

    function renderMarkdown(container) {
        container.querySelectorAll('.markdown-content:not([data-rendered])').forEach(function(el) {
            el.innerHTML = marked.parse(el.textContent);
            el.setAttribute('data-rendered', 'true');
        });
    }

    function setActiveSession(sessionId, element) {
        activeSession = sessionId;
        document.getElementById('session-id-input').value = sessionId;
        document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');
    }

    function clearChat() {
        activeSession = null;
        document.getElementById('session-id-input').value = '';
        document.getElementById('chat-area').innerHTML = `
            <div class="chat-header">New Chat</div>
            <div class="chat-messages" id="chat-messages">
                <div class="empty-state">
                    <div class="empty-state-title">What would you like to know?</div>
                    <div class="empty-state-subtitle">Ask a question about your data in plain English</div>
                </div>
            </div>
            <div class="chat-input-area">
                <form class="chat-input-form" onsubmit="return sendMessage(event)">
                    <input type="hidden" name="session_id" id="session-id-input" value="">
                    <input type="text" name="input" id="chat-input" placeholder="Ask a question..." autocomplete="off" required>
                    <button type="submit">Send</button>
                </form>
            </div>`;
    }

    async function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById('chat-input');
        const messagesDiv = document.getElementById('chat-messages');
        const text = input.value.trim();
        if (!text) return false;

        const emptyState = messagesDiv.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        // Add user message
        const userMsg = document.createElement('div');
        userMsg.className = 'message user';
        userMsg.textContent = text;
        messagesDiv.appendChild(userMsg);

        // Add typing indicator
        const indicator = document.createElement('div');
        indicator.className = 'typing-indicator';
        indicator.id = 'stream-indicator';
        indicator.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        messagesDiv.appendChild(indicator);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        input.value = '';

        const sessionId = document.getElementById('session-id-input').value;
        const formData = new FormData();
        formData.append('input', text);
        formData.append('session_id', sessionId);

        let assistantEl = null;
        let contentEl = null;
        let fullContent = '';

        try {
            const response = await fetch('/chat/stream', { method: 'POST', body: formData });
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                let eventType = null;
                for (const line of lines) {
                    if (line.startsWith('event: ')) {
                        eventType = line.slice(7).trim();
                    } else if (line.startsWith('data: ') && eventType) {
                        const data = JSON.parse(line.slice(6));
                        handleStreamEvent(eventType, data);
                        eventType = null;
                    }
                }
            }
        } catch (e) {
            const ind = document.getElementById('stream-indicator');
            if (ind) ind.remove();
            if (!assistantEl) {
                assistantEl = createAssistantMessage('Error: Failed to connect to server.');
                renderMarkdown(messagesDiv);
            }
        }

        // Refresh sidebar
        if (sessionId) {
            htmx.ajax('GET', '/sidebar', { target: '#sidebar-content', swap: 'innerHTML' });
        }

        function handleStreamEvent(type, data) {
            if (type === 'status') {
                const ind = document.getElementById('stream-indicator');
                if (ind) {
                    ind.className = 'status-indicator';
                    ind.innerHTML = data.message;
                }
            } else if (type === 'token') {
                if (!assistantEl) {
                    const ind = document.getElementById('stream-indicator');
                    if (ind) ind.remove();
                    assistantEl = createAssistantMessage('');
                    contentEl = assistantEl.querySelector('.markdown-content');
                }
                fullContent += data.content;
                contentEl.textContent = fullContent;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } else if (type === 'done') {
                if (contentEl) {
                    contentEl.innerHTML = marked.parse(fullContent);
                }
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function createAssistantMessage(text) {
            const msg = document.createElement('div');
            msg.className = 'message assistant';
            msg.innerHTML = `
                <div class="assistant-icon"><span>O</span></div>
                <div class="assistant-body">
                    <div class="markdown-content">${text}</div>
                </div>`;
            messagesDiv.appendChild(msg);
            return msg;
        }

        return false;
    }
</script>
{% endblock %}
