<div class="chat-header">Session</div>
<div class="chat-messages" id="chat-messages">
    {% for msg in messages %}
    {% if msg.role == "user" %}
    <div class="message user">{{ msg.content }}</div>
    {% else %}
    <div class="message assistant">
        <div class="assistant-icon"><span>O</span></div>
        <div class="assistant-body">
            <div class="markdown-content">{{ msg.content }}</div>
        </div>
    </div>
    {% endif %}
    {% endfor %}
    {% if not messages %}
    <div class="empty-state">
        <div class="empty-state-title">What would you like to know?</div>
        <div class="empty-state-subtitle">Ask a question about your data in plain English</div>
    </div>
    {% endif %}
</div>
<div class="chat-input-area">
    <form class="chat-input-form" onsubmit="return sendMessage(event)">
        <input type="hidden" name="session_id" id="session-id-input" value="{{ active_session or '' }}">
        <input type="text" name="input" id="chat-input" placeholder="Ask a question..." autocomplete="off" required>
        <button type="submit">Send</button>
    </form>
</div>
<script>
    {% if active_session %}
    activeSession = '{{ active_session }}';
    {% endif %}
    document.querySelectorAll('.markdown-content').forEach(function(el) {
        el.innerHTML = marked.parse(el.textContent);
    });
    var chatMessages = document.getElementById('chat-messages');
    if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
</script>
